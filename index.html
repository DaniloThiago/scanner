<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14121a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scanner">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Scanner</title>
</head>
<body>
  <div id="app">
    <header><h1>Scanner</h1></header>

    <main>
      <p id="empty">Toque em "Escanear documento" para usar a câmera, ou no botão da galeria para importar fotos.</p>

      <section id="result" hidden>
        <div class="row">
          <span id="pageLabel"></span>
          <button id="btnDelete" class="icon-btn" aria-label="Excluir esta página">
            <svg class="i" viewBox="0 0 24 24"><path d="M6,19c0,1.1 0.9,2 2,2h8c1.1,0 2,-0.9 2,-2V7H6v12zM19,4h-3.5l-1,-1h-5l-1,1H5v2h14V4z"/></svg>
          </button>
          <button id="btnNew" class="text-btn">
            <svg class="i" viewBox="0 0 24 24"><path d="M19,13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>Novo
          </button>
        </div>
        <div id="pages" class="pages"></div>
      </section>
    </main>

    <section id="share" hidden>
      <div class="row">
        <h2>Compartilhar</h2>
        <div class="toggle" role="group" aria-label="Formato">
          <button data-format="pdf" class="on">PDF</button>
          <button data-format="images">Imagens</button>
        </div>
      </div>
      <div class="options">
        <button id="btnSend" class="option">
          <span class="circle green">
            <svg class="i" viewBox="0 0 24 24"><path d="M18,16.08c-0.76,0 -1.44,0.3 -1.96,0.77L8.91,12.7c0.05,-0.23 0.09,-0.46 0.09,-0.7s-0.04,-0.47 -0.09,-0.7l7.05,-4.11c0.54,0.5 1.25,0.81 2.04,0.81 1.66,0 3,-1.34 3,-3s-1.34,-3 -3,-3 -3,1.34 -3,3c0,0.24 0.04,0.47 0.09,0.7L8.04,9.81C7.5,9.31 6.79,9 6,9c-1.66,0 -3,1.34 -3,3s1.34,3 3,3c0.79,0 1.5,-0.31 2.04,-0.81l7.12,4.16c-0.05,0.21 -0.08,0.43 -0.08,0.65 0,1.61 1.31,2.92 2.92,2.92 1.61,0 2.92,-1.31 2.92,-2.92s-1.31,-2.92 -2.92,-2.92z"/></svg>
          </span>
          <span>Enviar<br><small>WhatsApp, e-mail…</small></span>
        </button>
        <button id="btnDownload" class="option">
          <span class="circle blue">
            <svg class="i" viewBox="0 0 24 24"><path d="M5,20h14v-2H5V20zM19,9h-4V3H9v6H5l7,7L19,9z"/></svg>
          </span>
          <span id="downloadLabel">Baixar PDF</span>
        </button>
      </div>
    </section>

    <footer>
      <label class="btn-outline" aria-label="Galeria">
        <svg viewBox="0 0 24 24"><path d="M22,16V4c0,-1.1 -0.9,-2 -2,-2H8c-1.1,0 -2,0.9 -2,2v12c0,1.1 0.9,2 2,2h12c1.1,0 2,-0.9 2,-2zM11,12l2.03,2.71L16,11l4,5H8l3,-4zM2,6v14c0,1.1 0.9,2 2,2h14v-2H4V6H2z"/></svg>
        <input type="file" id="inGallery" accept="image/*" multiple hidden>
      </label>
      <label class="btn-primary">
        <svg viewBox="0 0 24 24"><path d="M7,3H4v3H2V1h5V3zM22,6V1h-5v2h3v3H22zM7,21H4v-3H2v5h5V21zM20,18v3h-3v2h5v-5H20zM19,18c0,1.1 -0.9,2 -2,2H7c-1.1,0 -2,-0.9 -2,-2V6c0,-1.1 0.9,-2 2,-2h10c1.1,0 2,0.9 2,2V18zM15,8H9v2h6V8zM15,11H9v2h6V11zM15,14H9v2h6V14z"/></svg>
        <span id="scanLabel">Escanear documento</span>
        <input type="file" id="inCamera" accept="image/*" capture="environment" hidden>
      </label>
    </footer>
  </div>

  <!-- Editor: ajustar bordas + filtros -->
  <div id="editor" hidden>
    <div class="ed-top">
      <button id="edBack" class="text-btn">Cancelar</button>
      <span id="edTitle">Ajustar bordas</span>
      <button id="edNext" class="text-btn strong">Avançar</button>
    </div>
    <div id="edStage" class="ed-stage">
      <canvas id="edCanvas"></canvas>
      <svg id="edOverlay"></svg>
    </div>
    <div class="ed-bottom">
      <div id="cropTools" class="chips">
        <button id="edAuto" class="chip">Detectar bordas</button>
        <button id="edFull" class="chip">Imagem inteira</button>
      </div>
      <div id="filterTools" class="chips" hidden>
        <button class="chip" data-filter="original">Original</button>
        <button class="chip" data-filter="enhance">Melhorado</button>
        <button class="chip" data-filter="gray">Cinza</button>
        <button class="chip" data-filter="bw">P&amp;B</button>
        <button id="edRotate" class="chip" aria-label="Girar">
          <svg class="i" viewBox="0 0 24 24"><path d="M15.55,5.55L11,1v3.07C7.06,4.56 4,7.92 4,12s3.05,7.44 7,7.93v-2.02c-2.84,-0.48 -5,-2.94 -5,-5.91s2.16,-5.43 5,-5.91V10l4.55,-4.45zM19.93,11c-0.17,-1.39 -0.72,-2.73 -1.62,-3.89l-1.42,1.42c0.54,0.75 0.88,1.6 1.02,2.47h2.02zM13,17.9v2.02c1.39,-0.17 2.74,-0.71 3.9,-1.61l-1.44,-1.44c-0.75,0.54 -1.59,0.89 -2.46,1.03zM16.89,15.48l1.42,1.41c0.9,-1.16 1.45,-2.5 1.62,-3.89h-2.02c-0.14,0.87 -0.48,1.72 -1.02,2.48z"/></svg>
        </button>
      </div>
      <p id="edHint">Arraste os cantos até as bordas do documento</p>
    </div>
  </div>

  <div id="busy" hidden><div class="spinner"></div><p id="busyText">Processando…</p></div>
  <div id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
